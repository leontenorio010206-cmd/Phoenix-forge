name: PhoenixForge | Importar y compilar Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhoenixForge_GitHub.git.bundle'
      - '.github/workflows/bootstrap-windows.yml'
permissions:
  contents: write
jobs:
  windows:
    name: Importacion + Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Importar codigo e historial desde Git bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'PhoenixForge_GitHub.git.bundle'
          if (!(Test-Path $bundle)) { throw 'Falta PhoenixForge_GitHub.git.bundle en la raiz. Subelo por Add file -> Upload files.' }
          $source = Join-Path $env:RUNNER_TEMP 'phoenix-sources'
          git clone --branch main $bundle $source
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo recuperar el bundle Git' }
          & robocopy $source $env:GITHUB_WORKSPACE /E /XD .git /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -gt 7) { throw 'Fallo al copiar el proyecto del bundle' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Do not commit bundled workflow files using GITHUB_TOKEN:
          # GitHub rejects these without workflow permission.
          # The bootstrap workflow itself remains in the repository.
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Import PhœnixForge v1.1.0 full project'
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear commit de importacion' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Falló la publicación del código fuente en main' }
          }
      - name: Instalar Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Dependencias Python
        shell: pwsh
        run: |
          python -m pip install pip==24.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements/build-modern.txt -r requirements/test-modern.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -m pip freeze | Out-File -Encoding utf8 build/python-packages.txt
      - name: Preparar MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make autoconf automake bison flex gperf
            mingw-w64-x86_64-gcc
      - name: Compilar Icarus Verilog 12.0
        shell: msys2 {0}
        run: bash tools/build_icarus_msys2.sh
      - name: Empaquetar runtime Icarus
        shell: pwsh
        run: |
          $prefix = (Get-Content build/icarus-prefix.txt -Raw).Trim()
          $bin = (Get-Content build/mingw-bin.txt -Raw).Trim()
          $licenses = (Get-Content build/mingw-licenses.txt -Raw).Trim()
          python tools/stage_icarus.py --prefix $prefix --dependency-bin $bin --license-dir $licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Licencias y fuentes Qt
        shell: pwsh
        run: |
          python tools/prepare_qt_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilacion y pruebas estrictas
        id: strict
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/build_windows.py --portable-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Intento alternativo marcado EXPERIMENTAL
        if: steps.strict.outcome == 'failure'
        shell: pwsh
        run: |
          python tools/build_windows.py --experimental-preview --portable-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Comprobar que existe el ejecutable
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -Path dist -Filter '*.exe' -ErrorAction SilentlyContinue)
          if ($exe.Count -lt 1) { throw 'No se genero ningun EXE' }
          foreach ($f in $exe) { Write-Host "$($f.Name): $($f.Length) bytes" }
      - name: Estado claro de la validacion
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.strict.outcome }}' -eq 'success') {
            Add-Content $env:GITHUB_STEP_SUMMARY 'Compilacion y validacion automatica en Windows Server 2022: APROBADA. Falta verificar en Windows 10 limpio.'
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'No hay certificacion de estabilidad: la compilacion estricta fallo o no se ejecuto. Cualquier EXE alternativo es EXPERIMENTAL.'
          }
      - name: Publicar artefactos de Windows (privados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Windows-v1.1
          path: |
            dist/*.exe
            dist/*.json
            build/windows-build-report.json
            build/windows-*-tests.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Diagnosticos
          path: |
            build/*.json
            build/*.txt
            build/*.xml
            build/work-modern/PhoenixForge/warn-*.txt
          if-no-files-found: warn
          retention-days: 14
