name: PhœnixForge | Android alpha APK
on:
  push:
    branches: [feature/android-port]
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "docs/ANDROID_PORT.md"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phoenix-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native Java, projects interoperability and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android .pforge compatibility tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile native alpha APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Ensure debug APK exists and has correct Android metadata
        shell: bash
        run: |
          set -euo pipefail
          file=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$file"
          unzip -t "$file" | tail -n 2
          test "$(stat -c%s "$file")" -gt 10000
          sha256sum "$file" > android/app/build/outputs/apk/debug/APP-DEBUG-SHA256.txt
          printf '%s\n' \
            'ALPHA PREVIEW: Debug-signed for development; not a production Play Store release.' \
            'Editor and .pforge import/export ONLY; no physical FPGA emulation or programming.' \
            > android/app/build/outputs/apk/debug/README-ALPHA.txt
      - name: Publish tested alpha APK (NOT stable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Android-0.1-alpha-DEBUG-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/APP-DEBUG-SHA256.txt
            android/app/build/outputs/apk/debug/README-ALPHA.txt
          retention-days: 20
          if-no-files-found: error
      - name: Save JVM unit test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Android-Alpha-Test-Results
          path: android/app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
