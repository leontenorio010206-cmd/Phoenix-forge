name: PhœnixForge | Linux x86_64 preview
on:
  push:
    branches: [feature/linux-port]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tools/build_linux.py"
      - "build/PhoenixForgeLinux.spec"
      - "linux/**"
      - "tests/test_linux_port.py"
      - "docs/LINUX_PORT.md"
      - ".github/workflows/ci-linux.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phoenix-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Native Ubuntu 22.04 build and frozen acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PHOENIXFORGE_QT: pyside6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements/modern.txt
            requirements/test-modern.txt
            requirements/build-modern.txt
      - name: Linux Icarus, Qt shared-library dependencies, Python build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iverilog libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libdbus-1-3
          python -m pip install -r requirements/build-modern.txt -r requirements/test-modern.txt
      - name: Build and verify frozen Linux GUI, simulation, project roundtrip
        run: python tools/build_linux.py
      - name: Publish preview only on full acceptance success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Linux-x86_64-PREVIEW
          path: |
            dist/PhoenixForge_Linux_x86_64_v1.7.0-preview.tar.gz
            dist/PhoenixForge_Linux_x86_64_v1.7.0-preview.tar.gz.sha256
            build/linux-preview-report.json
            build/linux-packaged-acceptance/acceptance.json
          retention-days: 20
          if-no-files-found: error
      - name: Preserve diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Linux-PREVIEW-Diagnostics
          path: |
            build/linux-tests.xml
            build/linux-preview-report.json
            build/linux-packaged-acceptance/**/*
            build/work-linux/PhoenixForgeLinux/warn-*.txt
          if-no-files-found: warn
