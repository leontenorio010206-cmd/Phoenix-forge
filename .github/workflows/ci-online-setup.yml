name: PhoenixForge | Online Setup smoke tests
on:
  push:
    branches: [feature/verified-online-setup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-setup:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Test receipt, hashes, installer release gate, and Digital detection
        shell: pwsh
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest tests/test_online_setup.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell parser and optional manifests
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installer/install_optional.ps1).Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Install test-only NSIS compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile NSIS syntax with a NON-FUNCTIONAL fixture
        shell: pwsh
        run: |
          New-Item -Type Directory -Force vendor/licenses,vendor/sources,dist | Out-Null
          Set-Content vendor/licenses/fixture-license.txt 'TEST FIXTURE ONLY'
          Set-Content vendor/sources/fixture-source.txt 'TEST FIXTURE ONLY'
          Set-Content dist/PhoenixForge_v1.7.0_Portable.exe 'TEST FIXTURE - NOT AN EXECUTABLE'
          $tool = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $tool /INPUTCHARSET UTF8 "/DPF_ROOT=$PWD" installer/PhoenixForge.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/PhoenixForge_v1.7.0_Setup.exe)) {
            throw 'No NSIS artifact generated'
          }
          Remove-Item dist/PhoenixForge_v1.7.0_Setup.exe -Force
          Remove-Item dist/PhoenixForge_v1.7.0_Portable.exe -Force
          Write-Host 'NSIS syntax compiled. No distributable executable was produced.'
