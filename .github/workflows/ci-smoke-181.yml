name: PhoenixForge | Setup 1.8.1 Smoke
on:
  push:
    branches: [feature/181-setup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Tests y sintaxis Python
        shell: pwsh
        run: |
          python -m pip install pytest==8.3.5
          python -m compileall -q app tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_setup_181.py tests/test_online_setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar PowerShell 5.1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installer/install_osscad_181.ps1).Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Instalar NSIS de prueba
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validar sintaxis NSIS con EXE ficticio, NO distribuir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/licenses,vendor/sources,dist | Out-Null
          Set-Content vendor/licenses/fixture.txt 'TEST ONLY'
          Set-Content vendor/sources/fixture.txt 'TEST ONLY'
          Set-Content dist/PhoenixForge_v1.8.1_Portable.exe 'NOT A VALID EXE'
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 "/DPF_ROOT=$PWD" installer/PhoenixForge_181.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/PhoenixForge_v1.8.1_Setup.exe)) { throw 'Setup no creado' }
          Remove-Item dist/PhoenixForge_v1.8.1_Setup.exe -Force
          Remove-Item dist/PhoenixForge_v1.8.1_Portable.exe -Force
