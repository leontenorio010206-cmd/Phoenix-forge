name: PhoenixForge | Windows 10 x64 v1.7 (acceptance required)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/verified-online-setup]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phoenixforge-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows native x64 / release gate
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python 3.11.9 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements/build-modern.txt
            requirements/modern.txt
            requirements/test-modern.txt
      - name: Dependencias verificadas de Python
        shell: pwsh
        run: |
          python -m pip install pip==24.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements/build-modern.txt -r requirements/test-modern.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -m pip freeze | Out-File -Encoding utf8 build/python-packages.txt
      - name: Verificación temprana de sintaxis Python
        shell: pwsh
        run: |
          python -m compileall -q app tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make patch autoconf automake bison flex gperf
            mingw-w64-x86_64-gcc
      - name: Compilar Icarus Verilog 12.0
        shell: msys2 {0}
        run: bash tools/build_icarus_msys2.sh
      - name: Empaquetar runtime y dependencias Icarus
        shell: pwsh
        run: |
          $prefix = (Get-Content build/icarus-prefix.txt -Raw).Trim()
          $bin = (Get-Content build/mingw-bin.txt -Raw).Trim()
          $licenses = (Get-Content build/mingw-licenses.txt -Raw).Trim()
          python tools/stage_icarus.py --prefix $prefix --dependency-bin $bin --license-dir $licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preservar fuentes y licencias Qt
        shell: pwsh
        run: |
          python tools/prepare_qt_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pruebas Windows y aceptación estricta del EXE
        id: strict
        timeout-minutes: 20
        shell: pwsh
        run: |
          python tools/build_windows.py --portable-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar reporte de liberación
        shell: pwsh
        run: |
          python tools/release_gate.py --report build/windows-build-report.json --directory dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar compilador NSIS y validar PowerShell del Setup
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installer/install_optional.ps1).Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('PowerShell inválido: ' + ($errors | Out-String)) }
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $guess = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path -LiteralPath $guess)) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Generar Setup Windows con Java y Digital opcionales
        shell: pwsh
        run: |
          python tools/build_setup_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Informe de tamaños y dependencias
        shell: pwsh
        run: |
          python tools/size_report.py --output build/size-report.json --dist dist --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Empaquetar fuentes actualizadas
        if: always()
        shell: pwsh
        run: |
          python tools/package_release.py --output dist/PhoenixForge_v1.7.0_Source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar ÚNICAMENTE EXE aceptado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-Windows-v1.7-VALIDADO-CI
          path: |
            dist/PhoenixForge_v1.7.0_Portable.exe
            dist/PhoenixForge_v1.7.0_Setup.exe
            dist/SHA256SUMS.txt
            build/windows-build-report.json
            build/setup-report.json
            build/size-report.json
            build/packaged-acceptance/packaged-acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Fuentes, disponibles separadamente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-v1.7-Fuentes-y-licencias
          path: |
            dist/PhoenixForge_v1.7.0_Source.zip
            dist/PhoenixForge_v1.7.0_Source.zip.sha256
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnósticos incluso si falla la aceptación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixForge-v1.7-Diagnosticos
          path: |
            build/*.json
            build/*.txt
            build/*.xml
            build/packaged-acceptance/**/*
            !build/packaged-acceptance/**/*.exe
            build/work-modern/PhoenixForge/warn-*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Resumen veraz de estado
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.strict.outcome }}' -eq 'success') {
            Add-Content $env:GITHUB_STEP_SUMMARY 'Ejecutable aprobado por suite de código y aceptación empaquetada nativa en Windows Server 2022. AÚN NO probado en laptops limpias ni firmado.'
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'FALLÓ aceptación estricta. NO se publica un EXE validado. Consulte diagnósticos.'
          }
