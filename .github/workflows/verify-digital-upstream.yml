name: Verify Digital upstream archive (hash research)
on:
  push:
    branches: [feature/verified-online-setup]
    paths: [.github/workflows/verify-digital-upstream.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checksum:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Fetch pinned Digital release and inspect archive
        shell: pwsh
        run: |
          $url = 'https://github.com/hneemann/Digital/releases/download/v0.31/Digital.zip'
          $file = Join-Path $env:RUNNER_TEMP 'Digital-v0.31.zip'
          Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 6 -ErrorAction Stop
          $size = (Get-Item $file).Length
          if ($size -ne 12689882) { throw "Unexpected Digital upstream size: $size" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($file)
          try {
            if (-not @($archive.Entries | Where-Object { $_.FullName -match '(^|/)Digital.jar$' }).Count) {
              throw 'Official archive does not contain Digital.jar'
            }
          } finally {
            $archive.Dispose()
          }
          $digest = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "DIGITAL_V031_SHA256=$digest"
          Write-Host "DIGITAL_V031_SIZE=$size"
