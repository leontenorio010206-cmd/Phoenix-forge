[build-system]
requires = ["setuptools>=61,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PhoenixForge"
version = "1.7.0"
description = "Forge Digital Logic: desktop Verilog and FPGA educational laboratory"
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = {text = "MIT"}
authors = [{name = "Leonardo Antonio Hernández Tenorio"}]
dependencies = [
  "PySide2==5.15.2.1; python_version < '3.9'",
  "PySide6==6.8.3; python_version >= '3.9'"
]

[project.gui-scripts]
PhoenixForge = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*.svg", "assets/*.ico", "assets/*.png", "assets/templates/*.v", "devices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["hdl: requires Icarus Verilog", "gui: requires PySide", "packaged: requires a built Windows executable"]

